name: Build EXE (Gerador de Termo)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        # A lista completa de passageiros:
        pip install customtkinter docxtpl python-docx tkcalendar requests spacy pyinstaller
        # Baixando o "motor" do SpaCy (ajuste se usar outro modelo)
        python -m spacy download pt_core_news_sm

    - name: Build EXE
      shell: pwsh
      run: |
        $CTK = python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))"
        $TKC = python -c "import tkcalendar, os; print(os.path.dirname(tkcalendar.__file__))"
        
        # O segredo aqui é o --collect-all spacy para levar os modelos junto
        pyinstaller --noconfirm --windowed --onefile `
          --collect-all spacy `
          --add-data "doc;doc" `
          --add-data "icon.ico;." `
          --add-data "$($CTK);customtkinter/" `
          --add-data "$($TKC);tkcalendar/" `
          --icon=icon.ico `
          --name "AutoDoc_V2.1" `
          main.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: gerador-termo-exe
        path: dist/*.exe