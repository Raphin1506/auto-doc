name: Build EXE (Gerador de Termo)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter docxtpl python-docx tkcalendar pyinstaller

    - name: Build EXE
      shell: pwsh
      run: |
        # 1. Descobrimos os caminhos das bibliotecas dinamicamente
        $CTK_PATH = python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))"
        $TKCAL_PATH = python -c "import tkcalendar, os; print(os.path.dirname(tkcalendar.__file__))"

        # 2. Rodamos o PyInstaller com os caminhos injetados
        pyinstaller --noconfirm --windowed --onefile `
          --add-data "doc;doc" `
          --add-data "icon.ico;." `
          --add-data "$($CTK_PATH);customtkinter/" `
          --add-data "$($TKCAL_PATH);tkcalendar/" `
          --icon=icon.ico `
          --name "AutoDoc_V2.1" `
          main.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: gerador-termo-exe
        path: dist/*.exe